# Jacky insurance demo (jack-motor.netlify.app).
# The site is built locally (npm run build) and dist/ is committed, so Netlify only publishes it.
# The Contact Center 360 mockup lives in its own repo: narongdechpas-coder/jacky-contact-center.
[build]
  publish = "dist"
  command = ""

[functions]
  # /api/chat: the customer chatbot (needs ANTHROPIC_API_KEY in the site's environment variables).
  directory = "netlify/functions"
